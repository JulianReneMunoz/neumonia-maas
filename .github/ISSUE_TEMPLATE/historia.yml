name: Historia de usuario
description: Una historia con criterios Given-When-Then, puntos Fibonacci y su spec SDD
title: "SPEC-NNN · "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Regla 1:1:** esta historia = 1 issue = 1 tarjeta = 1 spec en `specs/NNN-slug/` = 1 PR.
        La spec (spec.md, plan.md, tasks.md) se escribe y aprueba **antes** del código.
        Flujo, WIP limits y Definition of Done: [guía de contribución](https://github.com/JulianReneMunoz/neumonia-maas/blob/develop/CONTRIBUTING.md).
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Formato Como / quiero / para.
      placeholder: "Como médico, quiero ... para ..."
    validations:
      required: true
  - type: textarea
    id: ac
    attributes:
      label: Criterios de aceptación (Given-When-Then)
      placeholder: |
        AC-1
        - Dado ...
        - Cuando ...
        - Entonces ...
    validations:
      required: true
  - type: dropdown
    id: puntos
    attributes:
      label: Estimación (Fibonacci)
      description: Una sola estimación por historia, en puntos de historia.
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Ruta de la spec SDD
      placeholder: specs/NNN-slug/
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependencias
      placeholder: SPEC-001, SPEC-004 (o ninguna)
