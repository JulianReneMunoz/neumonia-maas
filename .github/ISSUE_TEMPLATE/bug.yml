name: Bug
description: Algo no funciona como dice su spec
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado y obtenido
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec afectada
      description: Opcional. Historia cuyo comportamiento no se cumple.
      placeholder: SPEC-NNN
