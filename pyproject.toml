[project]
name = "neumonia"
version = "0.1.0"
description = "Apoyo a la lectura de radiografías de tórax (NORMAL / PNEUMONIA) como servicio: API FastAPI + modelo ViT de Hugging Face."
readme = "README.md"
authors = [{ name = "Julián René Muñoz" }]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Las pruebas se documentan con su nombre (test_…); se mantiene ANN (-> None).
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--import-mode=importlib"]
filterwarnings = ["error"]
